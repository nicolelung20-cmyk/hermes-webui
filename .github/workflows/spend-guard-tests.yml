name: Spend guard tests

on:
  push:
    branches: ["fix/anne-spend-guard"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated spending-guard tests
        run: python -m unittest discover -s tests -v
