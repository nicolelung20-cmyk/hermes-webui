services:
  anne-secondary-host:
    build: .
    container_name: anne-secondary-host
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - anne-secondary-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  anne-secondary-data:
