name: paper-execution-smoke
on:
  push:
    branches: [feat/hermes-paper-execution-adapter]
  pull_request:
    branches: [main, feat/agentic-trading-risk-gate]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run paper executor smoke test
        run: python scripts/paper_trade_smoke.py
      - name: Run broker adapter tests
        run: python -m pytest -q tests/test_broker_adapter.py