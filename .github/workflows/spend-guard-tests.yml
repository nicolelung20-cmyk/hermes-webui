name: Spend guard tests

on:
  push:
    branches: ["master", "fix/anne-spend-guard", "fix/durable-spend-safety"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spend-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run spend guard tests
        run: python -m unittest tests.test_spend_guard tests.test_durable_spend_ledger -v
