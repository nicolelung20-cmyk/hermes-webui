<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>Hermes World Engine</title>
<style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#263140;--text:#edf3f8;--muted:#8d9aaa;--accent:#7ee787;--cyan:#58a6ff;--warn:#f2cc60;--danger:#ff7b72}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#162334 0,#080b10 48%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:240px 1fr 310px;grid-template-rows:58px 1fr 92px;gap:1px;background:var(--line)}
header{grid-column:1/4;background:rgba(10,13,18,.96);display:flex;align-items:center;padding:0 16px;gap:14px}
.logo{font-weight:800;letter-spacing:.08em}.badge{font-size:11px;border:1px solid #314052;border-radius:999px;padding:4px 8px;color:var(--accent)}
.spacer{flex:1}.worldclock{color:var(--muted);font-variant-numeric:tabular-nums}
aside,.inspector,footer{background:rgba(16,21,29,.97)}aside{padding:14px;overflow:auto}.nav h4{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.12em;margin:12px 8px 7px}.nav button,.quick button{width:100%;background:transparent;color:var(--text);border:1px solid transparent;text-align:left;border-radius:9px;padding:10px 11px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#19222e;border-color:#29384a}
main{position:relative;overflow:hidden;background:#0b1118}.city{position:absolute;inset:0;background-image:linear-gradient(#17212c 1px,transparent 1px),linear-gradient(90deg,#17212c 1px,transparent 1px);background-size:64px 64px;transform:perspective(900px) rotateX(44deg) scale(1.35);transform-origin:center 65%}
.road{position:absolute;background:#252f3b;box-shadow:inset 0 0 0 2px #344150}.r1{width:18%;height:100%;left:22%;top:0}.r2{width:18%;height:100%;right:18%;top:0}.r3{width:100%;height:17%;top:29%;left:0}.r4{width:100%;height:17%;top:67%;left:0}
.lot{position:absolute;width:130px;height:92px;border:1px solid #4a5b6e;background:#18222b;border-radius:6px;box-shadow:0 8px 25px #0006}.lot b{font-size:10px;color:#b9c7d5}.lot .roof{height:55px;background:linear-gradient(135deg,#344455,#202b38);margin:6px;border-radius:4px}
.agent{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #0b1118;background:var(--accent);box-shadow:0 0 16px #7ee78788;cursor:pointer;display:grid;place-items:center;font-size:12px;color:#061008;font-weight:800;z-index:4}.agent.ai{background:var(--cyan);box-shadow:0 0 16px #58a6ff88}.agent.selected{outline:3px solid white;outline-offset:3px}
.overlay{position:absolute;left:16px;top:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.statbar{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#0e151eeb;border:1px solid #2b3948;border-radius:8px;padding:8px 10px;backdrop-filter:blur(8px)}.chip small{color:var(--muted);display:block;font-size:9px;text-transform:uppercase}.chip strong{font-size:14px}
.inspector{padding:15px;overflow:auto}.card{background:#121923;border:1px solid #293544;border-radius:11px;padding:12px;margin-bottom:10px}.profile{display:flex;gap:10px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7ee787,#58a6ff);display:grid;place-items:center;color:#07100a;font-weight:900;font-size:20px}.muted{color:var(--muted)}.meter{height:7px;background:#27313d;border-radius:9px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}.row{display:flex;justify-content:space-between;margin:7px 0}.pill{font-size:10px;border-radius:999px;padding:3px 7px;background:#1d2936;color:#bcd0e2}
footer{grid-column:1/4;border-top:1px solid #273140;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:10px}.console{display:flex;gap:8px}.console input{flex:1;min-width:0;background:#090d12;border:1px solid #344150;color:white;border-radius:9px;padding:11px;font-family:ui-monospace,SFMono-Regular,monospace}.console button,.primary{background:var(--accent);color:#061008;border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.log{font:11px ui-monospace,monospace;color:#91a0b1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;right:18px;bottom:110px;background:#151d27;border:1px solid #3b4a5d;border-radius:10px;padding:12px 14px;box-shadow:0 12px 40px #0008;display:none;z-index:20}.toast.show{display:block}
@media(max-width:950px){.app{grid-template-columns:1fr;grid-template-rows:58px 1fr auto 92px}.app aside{display:none}.inspector{max-height:260px;grid-row:3}.app footer{grid-row:4}.overlay{top:8px}.city{transform:perspective(700px) rotateX(35deg) scale(1.25)}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">HERMES</div><span class="badge">WORLD ENGINE</span><span class="muted">Alpha-01 · Living Simulation</span><div class="spacer"></div><span id="status" class="badge">RUNNING</span><span class="worldclock" id="clock">Day 1 · 08:00</span></header>
<aside><div class="nav"><h4>World</h4><button class="active" data-view="live">◉ Live City</button><button data-view="agents">◎ Agents</button><button data-view="economy">◇ Economy</button><button data-view="experiments">⚗ Experiments</button><h4>Controls</h4><button id="pauseBtn">Ⅱ Pause</button><button id="stepBtn">▶ Step Day</button><button id="saveBtn">↥ Save World</button><button id="resetBtn">↺ Reset World</button><h4>Debug cheats</h4><div class="quick"><button data-cheat="rosebud">§ rosebud +$1,000</button><button data-cheat="motherlode">§ motherlode +$50,000</button></div></div></aside>
<main><div class="city" id="city">
<div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div>
<div class="lot" style="left:7%;top:18%"><div class="roof"></div><b>Maple House</b></div><div class="lot" style="left:35%;top:9%"><div class="roof"></div><b>Mercury Labs</b></div><div class="lot" style="left:65%;top:44%"><div class="roof"></div><b>Market District</b></div><div class="lot" style="left:8%;top:73%"><div class="roof"></div><b>Sunset Clinic</b></div>
</div><div class="overlay"><div class="statbar"><div class="chip"><small>Population</small><strong id="pop">24</strong></div><div class="chip"><small>World Wealth</small><strong id="wealth">$286,420</strong></div><div class="chip"><small>Employment</small><strong id="employment">79%</strong></div><div class="chip"><small>AI Access</small><strong id="ai">12%</strong></div></div></div></main>
<section class="inspector" id="inspector"></section>
<footer><div><div class="console"><input id="command" autocomplete="off" placeholder="Enter a world command… e.g. rosebud, motherlode, time 10, spawn agent"><button id="run">RUN</button></div><div class="log" id="log">SYSTEM · World initialized. Agents are autonomous.</div></div><div style="text-align:right"><div class="muted">Simulation speed</div><button class="primary" id="speed">1×</button></div></footer>
</div><div class="toast" id="toast"></div>
<script>
const KEY="hermes-world-alpha-01";
const defaults={day:1,hour:8,paused:false,wealth:286420,pop:24,ai:12,selected:0,events:[]};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
const agents=[
{name:"Maya Chen",job:"Medical Assistant",cash:2340,stress:42,energy:76,skill:63,goal:"Buy an apartment",ai:false},
{name:"Eli Brooks",job:"Founder",cash:8120,stress:61,energy:54,skill:81,goal:"Launch a company",ai:true},
{name:"Sam Rivera",job:"Data Analyst",cash:4670,stress:28,energy:88,skill:72,goal:"Learn quantum computing",ai:true},
{name:"Jordan Lee",job:"Barista",cash:910,stress:55,energy:63,skill:41,goal:"Find a better job",ai:false},
{name:"Avery Kim",job:"Engineer",cash:12800,stress:36,energy:81,skill:91,goal:"Build a new device",ai:true},
{name:"Noah Patel",job:"Teacher",cash:3100,stress:33,energy:70,skill:68,goal:"Start a side business",ai:false}
];
function money(n){return "$"+Math.round(n).toLocaleString()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function log(x){document.getElementById("log").textContent="EVENT · "+x;state.events.push({day:state.day,text:x});state.events=state.events.slice(-50);save()}
function render(){
 document.getElementById("clock").textContent=`Day ${state.day} · ${String(state.hour).padStart(2,"0")}:00`;
 document.getElementById("status").textContent=state.paused?"PAUSED":"RUNNING";
 document.getElementById("pop").textContent=state.pop;document.getElementById("wealth").textContent=money(state.wealth);document.getElementById("ai").textContent=state.ai+"%";
 const ins=document.getElementById("inspector"), a=agents[state.selected%agents.length];
 ins.innerHTML=`<div class="card"><div class="profile"><div class="avatar">${a.name.split(" ").map(x=>x[0]).join("")}</div><div><b>${a.name}</b><div class="muted">${a.job}</div></div></div><div style="margin-top:12px" class="row"><span>Cash</span><b>${money(a.cash)}</b></div><div class="row"><span>Goal</span><span class="pill">${a.goal}</span></div><div class="row"><span>AI access</span><span class="pill">${a.ai?"Enabled":"None"}</span></div></div>
 <div class="card"><b>Needs</b><div class="row"><span>Energy</span><b>${a.energy}%</b></div><div class="meter"><i style="width:${a.energy}%"></i></div><div class="row"><span>Stress</span><b>${a.stress}%</b></div><div class="meter"><i style="width:${a.stress}%"></i></div></div>
 <div class="card"><b>Skills</b><div class="row"><span>Primary skill</span><b>${a.skill}/100</b></div><div class="meter"><i style="width:${a.skill}%"></i></div><div class="muted" style="margin-top:10px">Autonomous agent · Memory enabled · Decision loop active</div></div>
 <div class="card"><b>Recent world events</b>${state.events.slice(-5).reverse().map(e=>`<div class="row"><span class="muted">D${e.day}</span><span>${e.text}</span></div>`).join("")||'<div class="muted">No events yet.</div>'}</div>`;
 renderAgents();
}
function renderAgents(){
 const city=document.getElementById("city");city.querySelectorAll(".agent").forEach(x=>x.remove());
 agents.forEach((a,i)=>{const d=document.createElement("div");d.className="agent "+(a.ai?"ai ":"")+(i===state.selected?"selected":"");d.textContent=a.name[0];d.style.left=(15+(i*13)%70)+"%";d.style.top=(18+(i*17)%62)+"%";d.title=a.name;d.onclick=()=>{state.selected=i;render()};city.appendChild(d)})
}
function cheat(cmd){
 const amount=cmd==="motherlode"?50000:1000;state.wealth+=amount;agents[state.selected].cash+=amount;log(`${cmd} applied to ${agents[state.selected].name}: +${money(amount)}`);toast(`${cmd}: +${money(amount)}`);render()
}
function command(raw){
 const c=raw.trim().toLowerCase();if(!c)return;
 if(c==="rosebud"||c==="motherlode"){cheat(c);return}
 if(c==="pause"){state.paused=true}
 else if(c==="resume"){state.paused=false}
 else if(c.startsWith("time ")){const n=Math.max(1,parseInt(c.split(" ")[1])||1);state.day+=Math.floor(n/24);state.hour=(state.hour+n)%24;log("Advanced "+n+" hours");}
 else if(c==="spawn agent"){state.pop++;log("Spawned autonomous agent #"+state.pop)}
 else if(c==="reset world"){state={...defaults,events:[]};log("World reset to baseline")}
 else {log("Unknown command: "+c);toast("Unknown command")}
 render();save()
}
document.getElementById("run").onclick=()=>{const x=document.getElementById("command");command(x.value);x.value=""};
document.getElementById("command").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("run").click()});
document.getElementById("pauseBtn").onclick=()=>command(state.paused?"resume":"pause");
document.getElementById("stepBtn").onclick=()=>command("time 24");
document.getElementById("saveBtn").onclick=()=>{save();toast("World saved locally");log("World state saved")};
document.getElementById("resetBtn").onclick=()=>command("reset world");
document.querySelectorAll("[data-cheat]").forEach(b=>b.onclick=()=>cheat(b.dataset.cheat));
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("active"));b.classList.add("active");toast(b.textContent.trim()+" view")});
setInterval(()=>{if(!state.paused){state.hour=(state.hour+1)%24;if(state.hour===0)state.day++;agents.forEach(a=>{a.energy=Math.max(10,Math.min(100,a.energy+(a.energy<40?8:-2)));a.stress=Math.max(5,Math.min(95,a.stress+(Math.random()-.52)*4));});render();save()}},4000);
render();
</script>
</body></html>
